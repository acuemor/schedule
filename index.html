<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f7fb"><title>Semana familiar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head><body><main class="app-shell">
<header class="hero"><div><span class="eyebrow">📚 ORGANIZADOR FAMILIAR</span><h1>La semana de <span>los peques</span></h1><p>Uniformes, piscina, extraescolares y eventos, de un vistazo.</p></div><div class="today-pill" id="todayPill"></div></header>
<section class="week-toolbar"><button class="nav-button" id="previousWeek" aria-label="Semana anterior">‹</button><div class="week-title"><strong id="weekLabel"></strong><span id="weekRange"></span></div><button class="nav-button" id="nextWeek" aria-label="Semana siguiente">›</button><button class="today-button" id="currentWeek">Hoy</button></section>
<div class="view-options">
  <label class="toggle-control" for="showWeekend">
    <span class="toggle-copy"><strong>Mostrar fines de semana</strong><small>Activa sábado y domingo en el calendario</small></span>
    <input type="checkbox" id="showWeekend" role="switch" aria-label="Mostrar sábados y domingos">
    <span class="toggle-track" aria-hidden="true"></span>
  </label>
</div>
<section class="today-summary" id="todaySummary"></section><section class="week-grid" id="weekGrid" aria-live="polite"></section>
<footer><span>🏃 Chándal</span><span>🧥 Uniforme</span><span>🏊 Piscina</span><span>⭐ Extraescolar</span><span>📌 Evento</span></footer>
</main><script src="config.js"></script><script src="script.js"></script></body></html>
